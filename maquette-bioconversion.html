<script>
function show() {
  var id = (location.hash || "#Main").slice(1);
  if (!document.getElementById("v-" + id)) id = "Main";
  document.querySelectorAll(".screen").forEach(function (s) { s.classList.toggle("on", s.id === "v-" + id); });
  document.querySelectorAll(".grp a").forEach(function (a) { a.classList.toggle("on", a.dataset.id === id); });
  window.scrollTo(0, 0);
}
function hdr() { document.documentElement.style.setProperty("--hdr", document.querySelector("header").offsetHeight + "px"); }
window.addEventListener("hashchange", show);
window.addEventListener("resize", hdr);
hdr(); show();
</script>
